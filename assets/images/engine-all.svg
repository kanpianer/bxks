      <mask id="mask-v" maskUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200">
        <rect x="-100" y="-100" width="200" height="200" fill="white"/>
        <path d="M -23 -7.6 L 0 -7.6 M -23 -16.3 L 0 -16.3 M 0 7.6 L 23 7.6 M 0 16.3 L 23 16.3" fill="none" stroke="black" stroke-width="10.7" stroke-linecap="butt"/>
      </mask>
    </defs>
    <!-- Horizontal Capsule (H) - Underpass in Q1 & Q3, masked -->
