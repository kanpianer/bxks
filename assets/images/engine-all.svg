<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#000000"/>
  <g transform="translate(50 50) rotate(45)">
    <!-- Horizontal Capsule (H) - Base -->
    <path d="M -32 -7.6 L 32 -7.6 A 7.6 7.6 0 0 1 32 7.6 L -32 7.6 A 7.6 7.6 0 0 1 -32 -7.6 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>
    <path d="M -32 -16.3 L 32 -16.3 A 16.3 16.3 0 0 1 32 16.3 L -32 16.3 A 16.3 16.3 0 0 1 -32 -16.3 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>

    <!-- Vertical Capsule (V) - Base -->
    <path d="M -7.6 -32 L -7.6 32 A 7.6 7.6 0 0 0 7.6 32 L 7.6 -32 A 7.6 7.6 0 0 0 -7.6 -32 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>
    <path d="M -16.3 -32 L -16.3 32 A 16.3 16.3 0 0 0 16.3 32 L 16.3 -32 A 16.3 16.3 0 0 0 -16.3 -32 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>

    <!-- Overpasses: V is over H in Q1 (x>0, y<0) and Q3 (x<0, y>0) -->
    <path d="M 7.6 -23 L 7.6 0 M 16.3 -23 L 16.3 0 M -7.6 0 L -7.6 23 M -16.3 0 L -16.3 23" fill="none" stroke="#000000" stroke-width="10.7" stroke-linecap="butt"/>
    <path d="M 7.6 -23 L 7.6 0 M 16.3 -23 L 16.3 0 M -7.6 0 L -7.6 23 M -16.3 0 L -16.3 23" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linecap="butt"/>

    <!-- Overpasses: H is over V in Q2 (x<0, y<0) and Q4 (x>0, y>0) -->
    <path d="M -23 -7.6 L 0 -7.6 M -23 -16.3 L 0 -16.3 M 0 7.6 L 23 7.6 M 0 16.3 L 23 16.3" fill="none" stroke="#000000" stroke-width="10.7" stroke-linecap="butt"/>
    <path d="M -23 -7.6 L 0 -7.6 M -23 -16.3 L 0 -16.3 M 0 7.6 L 23 7.6 M 0 16.3 L 23 16.3" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linecap="butt"/>
  </g>
</svg>
