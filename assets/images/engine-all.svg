    </g>

    <!-- Vertical Capsule (V) - Underpass in Q2 & Q4, masked -->
    <g mask="url(#mask-v)">
      <path d="M -7.6 -32 L -7.6 32 A 7.6 7.6 0 0 0 7.6 32 L 7.6 -32 A 7.6 7.6 0 0 0 -7.6 -32 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>
      <path d="M -16.3 -32 L -16.3 32 A 16.3 16.3 0 0 0 16.3 32 L 16.3 -32 A 16.3 16.3 0 0 0 -16.3 -32 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>
