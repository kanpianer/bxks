        <rect x="-100" y="-100" width="200" height="200" fill="white"/>
        <path d="M 7.6 -23 L 7.6 0 M 16.3 -23 L 16.3 0 M -7.6 0 L -7.6 23 M -16.3 0 L -16.3 23" fill="none" stroke="black" stroke-width="10.7" stroke-linecap="butt"/>
