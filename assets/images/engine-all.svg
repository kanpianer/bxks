      <path d="M -32 -7.6 L 32 -7.6 A 7.6 7.6 0 0 1 32 7.6 L -32 7.6 A 7.6 7.6 0 0 1 -32 -7.6 Z" fill="none" stroke="#ffffff" stroke-width="6.4" stroke-linejoin="round"/>
